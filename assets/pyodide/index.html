<!DOCTYPE html>
<!--
  Host page for the Python runtime (EP05, US26/US27). Loaded from Flutter
  assets via WebViewController.loadFlutterAsset, so every resource here
  (pyodide.js, the wasm binary, the stdlib zip) is bundled with the app and
  needs no network access — the whole point of choosing Pyodide over a
  cloud execution API was working offline (US31).
-->
<html>
  <head>
    <meta charset="utf-8" />
  </head>
  <body>
    <script src="pyodide.js"></script>
    <script>
      window.addEventListener('error', (e) => {
        FlutterChannel.postMessage(
          JSON.stringify({ event: 'loadError', error: e.message || String(e.error) })
        );
      });
      window.addEventListener('unhandledrejection', (e) => {
        FlutterChannel.postMessage(
          JSON.stringify({ event: 'loadError', error: e.reason && e.reason.message ? e.reason.message : String(e.reason) })
        );
      });

      const pyodideReadyPromise = loadPyodide({ indexURL: './' });

      pyodideReadyPromise.then(() => {
        FlutterChannel.postMessage(JSON.stringify({ event: 'ready' }));
      }).catch((e) => {
        FlutterChannel.postMessage(
          JSON.stringify({ event: 'loadError', error: e && e.message ? e.message : String(e) })
        );
      });

      async function runPython(requestId, code) {
        let stdoutChunks = [];
        let stderrChunks = [];
        try {
          const pyodide = await pyodideReadyPromise;
          stdoutChunks = [];
          stderrChunks = [];
          pyodide.setStdout({ batched: (s) => stdoutChunks.push(s) });
          pyodide.setStderr({ batched: (s) => stderrChunks.push(s) });
          await pyodide.runPythonAsync(code);
          FlutterChannel.postMessage(
            JSON.stringify({
              event: 'result',
              requestId: requestId,
              stdout: stdoutChunks.join('\n'),
              stderr: stderrChunks.join('\n'),
              error: null,
            })
          );
        } catch (e) {
          FlutterChannel.postMessage(
            JSON.stringify({
              event: 'result',
              requestId: requestId,
              stdout: stdoutChunks.join('\n'),
              stderr: stderrChunks.join('\n'),
              error: e && e.message ? e.message : String(e),
            })
          );
        }
      }
    </script>
  </body>
</html>
